schema_version: 2
id: replication
name: Replication
category: database
summary: "Maintain copies of data across multiple nodes or regions for availability and read scaling."
mechanism: "Propagates write-ahead log (WAL) entries or change-data-capture events from a primary to one or more replicas, which apply changes synchronously or asynchronously."
solves:
  - HIGH_AVAILABILITY_REQUIREMENT
  - DISASTER_RECOVERY_REQUIREMENT
  - HIGH_READ_LATENCY
  - SCALABILITY_PRESSURE
synergies_with:
  - sharding
  - backup_strategies
  - encryption
  - multi_region
conflicts_with: []
requires: []
avoid_when:
  - condition: "Single-node availability is acceptable"
    reason: "Replication doubles infrastructure cost for unneeded redundancy."
  - condition: "Budget cannot support multiple database instances"
    reason: "Each replica requires compute, storage, and networking resources."
applicable_when:
  availability_class: [HIGH, VERY_HIGH, MISSION_CRITICAL]
implementation_complexity: medium
impacts:
  storage: -2
  performance: 3
  cost: -2
  scalability: 4
  security: 0
benefits:
  - "Automatic failover for high availability"
  - "Read scaling via read replicas"
  - "Geographic distribution for lower latency"
  - "Data protection against node failure"
disadvantages:
  - "Replication lag can cause stale reads"
  - "Write throughput is limited by synchronous replication"
  - "Additional infrastructure cost"
companies: []

variants:
  - id: synchronous
    name: Synchronous Replication
    summary: "Commit a write only after all replicas have acknowledged, guaranteeing zero data loss on failover."
    mechanism: "The primary sends WAL entries to replicas and waits for durable acknowledgement from every replica before confirming the commit to the client."
    impacts:
      storage: -2
      performance: 1
      cost: -2
      scalability: 3
      security: 0
    benefits:
      - "Zero data loss (RPO = 0) on failover"
      - "Strong consistency across replicas"
      - "Data protection against node failure"
    disadvantages:
      - "Write latency increases with replica distance"
      - "Throughput limited by the slowest replica"
      - "Additional infrastructure cost"

  - id: asynchronous
    name: Asynchronous Replication
    summary: "Replicate writes in the background after the primary commits, trading consistency for lower write latency."
    mechanism: "The primary commits locally and streams WAL entries to replicas asynchronously; replicas apply changes with a configurable lag."
    impacts:
      storage: -2
      performance: 4
      cost: -2
      scalability: 4
      security: 0
    benefits:
      - "Minimal write-path latency overhead"
      - "Read scaling via read replicas"
      - "Geographic distribution for lower read latency"
    disadvantages:
      - "Replication lag can cause stale reads"
      - "Data loss window equal to replication lag on failover"
      - "Additional infrastructure cost"
