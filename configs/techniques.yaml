## Storage Optimization Technique Knowledge Base
## Version: 1.0.0
##
## Each technique has:
##   solves           - which ProblemIds this technique addresses
##   applicable_when  - profile/scenario conditions (ANY match within a key)
##   conflicts_with   - technique IDs that are incompatible
##   not_recommended_when - human-readable conditions to avoid this technique

techniques:

  # =========================================================================
  # STORAGE TECHNIQUES
  # =========================================================================

  - id: compression
    name: Compression
    category: STORAGE
    description: "Reduce data size using lossless or lossy algorithms to lower storage costs and improve I/O throughput."
    solves:
      - MODERATE_STORAGE_GROWTH
      - HIGH_STORAGE_GROWTH
      - EXTREME_STORAGE_GROWTH
      - HOT_COLD_DATA_MIX
    applicable_when:
      storage_growth: [MEDIUM, MODERATE, HIGH, EXTREME]
    benefits:
      - "Reduces storage footprint by 30-70% depending on data type"
      - "Reduces network transfer costs"
      - "Improves I/O throughput for sequential reads"
    disadvantages:
      - "CPU overhead for compression/decompression"
      - "May increase latency for random access patterns"
      - "Compression ratio varies significantly by data type"
    implementation_complexity: LOW
    storage_impact: HIGH_IMPROVEMENT
    performance_impact: SLIGHT_IMPROVEMENT
    cost_impact: HIGH_IMPROVEMENT
    scalability_impact: MODERATE_IMPROVEMENT
    prerequisites: []
    conflicts_with: []
    not_recommended_when:
      - "Data is already compressed (images, videos in compressed formats)"
      - "Ultra-low latency random reads are required and CPU budget is tight"

  - id: deduplication
    name: Deduplication
    category: STORAGE
    description: "Eliminate redundant copies of data to reduce storage consumption."
    solves:
      - MODERATE_STORAGE_GROWTH
      - HIGH_STORAGE_GROWTH
      - EXTREME_STORAGE_GROWTH
      - HOT_COLD_DATA_MIX
    applicable_when:
      storage_growth: [MEDIUM, MODERATE, HIGH, EXTREME]
    benefits:
      - "Significant storage reduction when duplicate data is common"
      - "Reduces backup storage requirements"
    disadvantages:
      - "Computational overhead for hash comparison"
      - "Memory-intensive dedup index"
      - "Risk of hash collision (extremely rare but not zero)"
    implementation_complexity: HIGH
    storage_impact: HIGH_IMPROVEMENT
    performance_impact: NEUTRAL
    cost_impact: MODERATE_IMPROVEMENT
    scalability_impact: SLIGHT_IMPROVEMENT
    prerequisites: []
    conflicts_with: []
    not_recommended_when:
      - "Data has very low redundancy (unique sensor readings, time-series)"
      - "Startup team lacks operational capacity for dedup infrastructure"
      - "Budget does not support the additional compute"

  - id: object_storage
    name: Object Storage
    category: STORAGE
    description: "Store unstructured data (images, videos, documents) in a scalable object store rather than a relational database."
    solves:
      - LARGE_UNSTRUCTURED_OBJECT_WORKLOAD
      - MODERATE_STORAGE_GROWTH
      - HIGH_STORAGE_GROWTH
      - EXTREME_STORAGE_GROWTH
      - SCALABILITY_PRESSURE
    applicable_when:
      object_storage_pressure: [MEDIUM, HIGH]
    benefits:
      - "Near-infinite horizontal scalability"
      - "Low cost per GB compared to block or database storage"
      - "Built-in redundancy and durability"
      - "Native lifecycle management support"
    disadvantages:
      - "Higher latency than local/block storage for small objects"
      - "Eventual consistency in some implementations"
      - "Not suitable for transactional or relational queries"
    implementation_complexity: LOW
    storage_impact: HIGH_IMPROVEMENT
    performance_impact: SLIGHT_IMPROVEMENT
    cost_impact: HIGH_IMPROVEMENT
    scalability_impact: HIGH_IMPROVEMENT
    prerequisites: []
    conflicts_with: []
    not_recommended_when:
      - "All data is purely structured/transactional with no binary objects"

  - id: tiered_storage
    name: Tiered Storage
    category: STORAGE
    description: "Separate data across hot, warm, and cold storage tiers based on access frequency."
    solves:
      - HOT_COLD_DATA_MIX
      - MODERATE_STORAGE_GROWTH
      - HIGH_STORAGE_GROWTH
      - EXTREME_STORAGE_GROWTH
      - LONG_TERM_RETENTION
    applicable_when:
      retention_class: [MEDIUM_TERM, LONG_TERM]
      storage_growth: [MEDIUM, MODERATE, HIGH, EXTREME]
    benefits:
      - "Significant cost reduction by moving cold data to cheaper storage"
      - "Maintains fast access for frequently used data"
    disadvantages:
      - "Requires data lifecycle classification logic"
      - "Retrieval from cold tiers may have higher latency"
      - "Migration policies need monitoring and tuning"
    implementation_complexity: MEDIUM
    storage_impact: MODERATE_IMPROVEMENT
    performance_impact: SLIGHT_IMPROVEMENT
    cost_impact: HIGH_IMPROVEMENT
    scalability_impact: MODERATE_IMPROVEMENT
    prerequisites: []
    conflicts_with: []
    not_recommended_when:
      - "All data is accessed uniformly with no clear hot/cold boundary"
      - "Retention is very short (under 6 months)"

  - id: archiving
    name: Archiving
    category: STORAGE
    description: "Move historical or rarely accessed data to low-cost archival storage."
    solves:
      - LONG_TERM_RETENTION
      - HOT_COLD_DATA_MIX
      - MODERATE_STORAGE_GROWTH
      - HIGH_STORAGE_GROWTH
      - EXTREME_STORAGE_GROWTH
    applicable_when:
      retention_class: [LONG_TERM]
    benefits:
      - "Lowest cost per GB for long-term data preservation"
      - "Satisfies regulatory retention requirements"
    disadvantages:
      - "High retrieval latency (minutes to hours)"
      - "Retrieval costs can be significant"
      - "Data must be identified and classified before archiving"
    implementation_complexity: MEDIUM
    storage_impact: HIGH_IMPROVEMENT
    performance_impact: NEUTRAL
    cost_impact: HIGH_IMPROVEMENT
    scalability_impact: MODERATE_IMPROVEMENT
    prerequisites: []
    conflicts_with: []
    not_recommended_when:
      - "All data needs to be accessible with low latency"
      - "Retention period is less than 1 year"

  - id: lifecycle_management
    name: Lifecycle Management
    category: STORAGE
    description: "Automate data transitions between storage tiers and eventual deletion based on age or access patterns."
    solves:
      - HOT_COLD_DATA_MIX
      - MODERATE_STORAGE_GROWTH
      - HIGH_STORAGE_GROWTH
      - EXTREME_STORAGE_GROWTH
      - LONG_TERM_RETENTION
    applicable_when:
      retention_class: [MEDIUM_TERM, LONG_TERM]
      storage_growth: [MEDIUM, MODERATE, HIGH, EXTREME]
    benefits:
      - "Automated cost optimization without manual intervention"
      - "Ensures compliance with retention policies"
      - "Reduces operational burden of data management"
    disadvantages:
      - "Requires clear lifecycle rules and policies"
      - "Misconfigured policies can delete data prematurely"
    implementation_complexity: MEDIUM
    storage_impact: MODERATE_IMPROVEMENT
    performance_impact: NEUTRAL
    cost_impact: HIGH_IMPROVEMENT
    scalability_impact: MODERATE_IMPROVEMENT
    prerequisites:
      - tiered_storage
    conflicts_with: []
    not_recommended_when:
      - "No clear data aging pattern exists"
      - "All data must be retained at the same tier indefinitely"

  - id: chunking
    name: Chunking
    category: STORAGE
    description: "Split large files into smaller fixed-size or content-defined chunks for efficient storage and transfer."
    solves:
      - LARGE_UNSTRUCTURED_OBJECT_WORKLOAD
      - MODERATE_STORAGE_GROWTH
      - HIGH_STORAGE_GROWTH
      - EXTREME_STORAGE_GROWTH
    applicable_when:
      object_storage_pressure: [HIGH]
      storage_growth: [MODERATE, HIGH, EXTREME]
    benefits:
      - "Enables deduplication at chunk level"
      - "Improves upload/download parallelism"
      - "Supports resumable transfers"
    disadvantages:
      - "Adds metadata overhead for chunk tracking"
      - "Reassembly complexity for reads"
    implementation_complexity: HIGH
    storage_impact: MODERATE_IMPROVEMENT
    performance_impact: MODERATE_IMPROVEMENT
    cost_impact: SLIGHT_IMPROVEMENT
    scalability_impact: MODERATE_IMPROVEMENT
    prerequisites:
      - object_storage
    conflicts_with: []
    not_recommended_when:
      - "Files are small (under 10 MB)"
      - "Simple object storage handles the workload adequately"

  # =========================================================================
  # DATABASE TECHNIQUES
  # =========================================================================

  - id: partitioning
    name: Partitioning
    category: DATABASE
    description: "Divide large tables into smaller partitions based on a key (date, region, ID range) to improve query performance and manageability."
    solves:
      - LARGE_TRANSACTIONAL_DATASET
      - HIGH_WRITE_PRESSURE
      - HIGH_READ_LATENCY
    applicable_when:
      write_pressure: [MEDIUM, HIGH]
    benefits:
      - "Dramatically faster queries that match the partition key"
      - "Easier maintenance (drop/archive individual partitions)"
      - "Improved write throughput via partition-level locking"
    disadvantages:
      - "Cross-partition queries can be slower"
      - "Requires careful partition key selection"
      - "Schema changes can be more complex"
    implementation_complexity: MEDIUM
    storage_impact: NEUTRAL
    performance_impact: HIGH_IMPROVEMENT
    cost_impact: SLIGHT_IMPROVEMENT
    scalability_impact: HIGH_IMPROVEMENT
    prerequisites: []
    conflicts_with: []
    not_recommended_when:
      - "Dataset is small (under 10 GB)"
      - "Queries rarely filter on the partition key"

  - id: indexing
    name: Indexing
    category: DATABASE
    description: "Create database indexes to accelerate read queries on frequently accessed columns."
    solves:
      - HIGH_READ_LATENCY
      - LARGE_TRANSACTIONAL_DATASET
    applicable_when:
      read_pressure: [MEDIUM, HIGH]
    benefits:
      - "Orders-of-magnitude faster lookups on indexed columns"
      - "Supports efficient sorting and filtering"
    disadvantages:
      - "Increases write latency (index maintenance on every write)"
      - "Additional storage for index structures"
      - "Over-indexing degrades write performance"
    implementation_complexity: LOW
    storage_impact: SLIGHT_INCREASE
    performance_impact: HIGH_IMPROVEMENT
    cost_impact: NEUTRAL
    scalability_impact: MODERATE_IMPROVEMENT
    prerequisites: []
    conflicts_with: []
    not_recommended_when:
      - "Write-heavy workload where every millisecond of write latency matters"
      - "Queries are analytical scans rather than point lookups"

  - id: sharding
    name: Sharding
    category: DATABASE
    description: "Distribute data across multiple database instances based on a shard key for horizontal scaling."
    solves:
      - SCALABILITY_PRESSURE
      - LARGE_TRANSACTIONAL_DATASET
      - HIGH_WRITE_PRESSURE
      - HIGH_STORAGE_GROWTH
      - EXTREME_STORAGE_GROWTH
    applicable_when:
      scalability_pressure: [HIGH]
      write_pressure: [HIGH]
      storage_growth: [HIGH, EXTREME]
    benefits:
      - "Near-linear write throughput scaling"
      - "Each shard handles a fraction of total load"
    disadvantages:
      - "Significant operational complexity"
      - "Cross-shard queries are expensive or impossible"
      - "Rebalancing shards is disruptive"
      - "Application-level routing required"
    implementation_complexity: HIGH
    storage_impact: NEUTRAL
    performance_impact: HIGH_IMPROVEMENT
    cost_impact: MODERATE_INCREASE
    scalability_impact: HIGH_IMPROVEMENT
    prerequisites:
      - partitioning
    conflicts_with: []
    not_recommended_when:
      - "Single database can handle the load"
      - "Team lacks experience with distributed databases"
      - "Cross-shard joins are frequently needed"

  - id: replication
    name: Replication
    category: DATABASE
    description: "Maintain copies of data across multiple nodes or regions for availability and read scaling."
    solves:
      - HIGH_AVAILABILITY_REQUIREMENT
      - DISASTER_RECOVERY_REQUIREMENT
      - HIGH_READ_LATENCY
      - SCALABILITY_PRESSURE
    applicable_when:
      availability_class: [HIGH, VERY_HIGH, MISSION_CRITICAL]
    benefits:
      - "Automatic failover for high availability"
      - "Read scaling via read replicas"
      - "Geographic distribution for lower latency"
      - "Data protection against node failure"
    disadvantages:
      - "Replication lag can cause stale reads"
      - "Write throughput is limited by synchronous replication"
      - "Additional infrastructure cost"
    implementation_complexity: MEDIUM
    storage_impact: MODERATE_INCREASE
    performance_impact: MODERATE_IMPROVEMENT
    cost_impact: MODERATE_INCREASE
    scalability_impact: HIGH_IMPROVEMENT
    prerequisites: []
    conflicts_with: []
    not_recommended_when:
      - "Single-node availability is acceptable"
      - "Budget cannot support multiple database instances"

  - id: schema_optimization
    name: Schema Optimization
    category: DATABASE
    description: "Redesign database schema for query efficiency: normalize or denormalize based on workload patterns."
    solves:
      - LARGE_TRANSACTIONAL_DATASET
      - HIGH_READ_LATENCY
    applicable_when:
      read_pressure: [MEDIUM, HIGH]
    benefits:
      - "Reduces unnecessary joins"
      - "Improves query planning efficiency"
      - "Can eliminate redundant data"
    disadvantages:
      - "Denormalization introduces update anomalies"
      - "Requires deep understanding of query patterns"
    implementation_complexity: MEDIUM
    storage_impact: SLIGHT_IMPROVEMENT
    performance_impact: MODERATE_IMPROVEMENT
    cost_impact: NEUTRAL
    scalability_impact: SLIGHT_IMPROVEMENT
    prerequisites: []
    conflicts_with: []
    not_recommended_when:
      - "Schema is simple and queries already perform well"
      - "Workload is purely write-heavy with minimal reads"

  # =========================================================================
  # PERFORMANCE TECHNIQUES
  # =========================================================================

  - id: caching
    name: Caching
    category: PERFORMANCE
    description: "Store frequently accessed data in a fast in-memory cache to reduce database load and response latency."
    solves:
      - HIGH_READ_LATENCY
      - SCALABILITY_PRESSURE
    applicable_when:
      read_pressure: [HIGH]
      latency_class: [LOW_LATENCY, ULTRA_LOW_LATENCY]
    benefits:
      - "10-100x latency reduction for cached data"
      - "Dramatically reduces database read load"
      - "Handles traffic spikes via cache absorption"
    disadvantages:
      - "Cache invalidation complexity"
      - "Memory cost for cache infrastructure"
      - "Stale data risk without proper TTL strategy"
    implementation_complexity: MEDIUM
    storage_impact: NEUTRAL
    performance_impact: HIGH_IMPROVEMENT
    cost_impact: MODERATE_INCREASE
    scalability_impact: HIGH_IMPROVEMENT
    prerequisites: []
    conflicts_with: []
    not_recommended_when:
      - "Data changes on every read (no repeat reads)"
      - "Write-dominant workload with negligible read traffic"
      - "Dataset is small enough to fit in database memory"

  - id: materialized_views
    name: Materialized Views
    category: PERFORMANCE
    description: "Pre-compute and store query results for expensive aggregations or joins."
    solves:
      - HIGH_READ_LATENCY
      - HIGH_ANALYTICS_WORKLOAD
    applicable_when:
      read_pressure: [MEDIUM, HIGH]
      analytics_pressure: [MEDIUM, HIGH]
    benefits:
      - "Eliminates repeated expensive computation"
      - "Provides near-instant response for pre-computed queries"
    disadvantages:
      - "Storage overhead for materialized data"
      - "Refresh strategy needed (stale vs fresh trade-off)"
      - "Not suitable for highly dynamic data"
    implementation_complexity: MEDIUM
    storage_impact: SLIGHT_INCREASE
    performance_impact: HIGH_IMPROVEMENT
    cost_impact: SLIGHT_INCREASE
    scalability_impact: MODERATE_IMPROVEMENT
    prerequisites: []
    conflicts_with: []
    not_recommended_when:
      - "Underlying data changes every second and views must be fresh"
      - "Query patterns are unpredictable (ad-hoc exploration)"

  - id: query_optimization
    name: Query Optimization
    category: PERFORMANCE
    description: "Analyze and rewrite slow queries, optimize execution plans, and eliminate unnecessary operations."
    solves:
      - HIGH_READ_LATENCY
      - LARGE_TRANSACTIONAL_DATASET
    applicable_when:
      read_pressure: [MEDIUM, HIGH]
    benefits:
      - "Often the highest-ROI performance improvement"
      - "No additional infrastructure cost"
      - "Reduces compute and I/O waste"
    disadvantages:
      - "Requires query profiling expertise"
      - "Benefits are workload-specific and not always predictable"
    implementation_complexity: MEDIUM
    storage_impact: NEUTRAL
    performance_impact: HIGH_IMPROVEMENT
    cost_impact: SLIGHT_IMPROVEMENT
    scalability_impact: SLIGHT_IMPROVEMENT
    prerequisites: []
    conflicts_with: []
    not_recommended_when:
      - "Queries are already optimized"
      - "Performance bottleneck is not in the database layer"

  - id: data_pruning
    name: Data Pruning
    category: PERFORMANCE
    description: "Remove or archive obsolete, expired, or irrelevant data to reduce dataset size."
    solves:
      - MODERATE_STORAGE_GROWTH
      - HIGH_STORAGE_GROWTH
      - EXTREME_STORAGE_GROWTH
      - HOT_COLD_DATA_MIX
      - LARGE_TRANSACTIONAL_DATASET
    applicable_when:
      storage_growth: [MEDIUM, MODERATE, HIGH, EXTREME]
      retention_class: [MEDIUM_TERM, LONG_TERM]
    benefits:
      - "Reduces storage costs directly"
      - "Improves query performance on smaller datasets"
      - "Simplifies backup and restore"
    disadvantages:
      - "Risk of premature data deletion"
      - "Requires clear retention and pruning policies"
    implementation_complexity: LOW
    storage_impact: HIGH_IMPROVEMENT
    performance_impact: MODERATE_IMPROVEMENT
    cost_impact: HIGH_IMPROVEMENT
    scalability_impact: MODERATE_IMPROVEMENT
    prerequisites: []
    conflicts_with: []
    not_recommended_when:
      - "Regulatory requirements forbid deletion"
      - "All data has ongoing business value"

  # =========================================================================
  # ANALYTICS TECHNIQUES
  # =========================================================================

  - id: columnar_storage
    name: Columnar Storage
    category: ANALYTICS
    description: "Store data in column-oriented format for efficient analytical queries that scan specific columns."
    solves:
      - HIGH_ANALYTICS_WORKLOAD
      - HIGH_READ_LATENCY
    applicable_when:
      analytics_pressure: [MEDIUM, HIGH]
    benefits:
      - "10-100x faster analytical queries vs row-oriented storage"
      - "Excellent compression for columnar data"
      - "Reduces I/O by reading only needed columns"
    disadvantages:
      - "Poor performance for single-row lookups"
      - "Write amplification for row-level updates"
      - "Not suitable for OLTP workloads"
    implementation_complexity: MEDIUM
    storage_impact: MODERATE_IMPROVEMENT
    performance_impact: HIGH_IMPROVEMENT
    cost_impact: MODERATE_IMPROVEMENT
    scalability_impact: HIGH_IMPROVEMENT
    prerequisites: []
    conflicts_with: []
    not_recommended_when:
      - "Workload is purely transactional with no analytics"
      - "Queries always fetch full rows"

  - id: data_aggregation
    name: Data Aggregation
    category: ANALYTICS
    description: "Pre-aggregate raw data into summary tables for faster reporting and dashboards."
    solves:
      - HIGH_ANALYTICS_WORKLOAD
      - HIGH_READ_LATENCY
    applicable_when:
      analytics_pressure: [MEDIUM, HIGH]
    benefits:
      - "Orders-of-magnitude faster dashboard queries"
      - "Reduces compute cost for repeated reports"
    disadvantages:
      - "Loss of granularity in aggregated data"
      - "Aggregation pipeline needs maintenance"
      - "Cannot answer ad-hoc queries on raw data"
    implementation_complexity: MEDIUM
    storage_impact: SLIGHT_IMPROVEMENT
    performance_impact: HIGH_IMPROVEMENT
    cost_impact: MODERATE_IMPROVEMENT
    scalability_impact: MODERATE_IMPROVEMENT
    prerequisites: []
    conflicts_with: []
    not_recommended_when:
      - "Users need access to raw granular data"
      - "Query patterns are unpredictable"

  - id: parquet_format
    name: Parquet Format
    category: ANALYTICS
    description: "Use Apache Parquet columnar file format for efficient analytical data storage and processing."
    solves:
      - HIGH_ANALYTICS_WORKLOAD
      - MODERATE_STORAGE_GROWTH
      - HIGH_STORAGE_GROWTH
      - EXTREME_STORAGE_GROWTH
    applicable_when:
      analytics_pressure: [MEDIUM, HIGH]
    benefits:
      - "Excellent compression (often 5-10x vs CSV/JSON)"
      - "Column pruning for efficient analytical queries"
      - "Schema evolution support"
      - "Broad ecosystem support (Spark, DuckDB, Pandas, Athena)"
    disadvantages:
      - "Not suitable for low-latency point queries"
      - "Write-once, read-many pattern (no in-place updates)"
      - "Requires tooling that supports the format"
    implementation_complexity: LOW
    storage_impact: HIGH_IMPROVEMENT
    performance_impact: MODERATE_IMPROVEMENT
    cost_impact: MODERATE_IMPROVEMENT
    scalability_impact: HIGH_IMPROVEMENT
    prerequisites: []
    conflicts_with: []
    not_recommended_when:
      - "Data requires frequent row-level updates"
      - "No analytical workload exists"
