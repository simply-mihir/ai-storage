version: "3.9"
services:
  app:
    build: .
    ports:
      - "8001:8001"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - DATABASE_URL=postgresql://advisor:advisor@postgres:5432/advisor
      - LLM_MODEL_ID=${LLM_MODEL_ID:-amazon.nova-lite-v1:0}
      - LLM_FALLBACK_KEY=${LLM_FALLBACK_KEY}
      - API_KEYS=${API_KEYS:-dev-demo-key}
      - ENV=${ENV:-dev}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: advisor
      POSTGRES_PASSWORD: advisor
      POSTGRES_DB: advisor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisor"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
